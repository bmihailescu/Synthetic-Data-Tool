apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Chart.Name }}
  namespace: {{ $.Values.global.namespace | default $.Release.Namespace }}
  labels:
    application: {{ $.Chart.Name }}
    deployment: {{ $.Chart.Name }}
    service: {{ $.Chart.Name }}
    costcentre: {{ .Values.global.costcentre | quote }}
    schedule: {{ .Values.global.schedule | quote }}
spec:
  replicas: {{ .Values.app.replicas }}
  strategy: {{- include "syntheticDataTool.library.deploymentStrategy" . | nindent 4 }}
  selector:
    matchLabels:
      deployment: {{ $.Chart.Name }}
  template:
    metadata:
      labels:
        application: {{ $.Chart.Name }}
        deployment: {{ $.Chart.Name }}
        service: {{ $.Chart.Name }}
        costcentre: {{ .Values.global.costcentre | quote }}
        schedule: {{ .Values.global.schedule | quote }}
    spec:
      affinity: {{- include "syntheticDataTool.library.affinity" $ | nindent 8 }}
      containers:
        - name: {{ .Values.app.name }}
          image: {{ printf "%s:%s" .Values.global.image.imageRepository $.Values.app.image_tag }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy | quote }}
          env:
          - name: HOSTNAME
            value: {{ $.Values.app.url | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.app.containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: {{ required ".Values.containerPort missing" .Values.app.containerPort }}
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
          resources: {{- toYaml .Values.app.resources | nindent 12 }}