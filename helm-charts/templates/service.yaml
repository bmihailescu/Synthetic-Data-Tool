apiVersion: v1
kind: Service
metadata:
  name: {{ $.Chart.Name }}
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    application: {{ $.Chart.Name }}
    deployment: {{ $.Chart.Name }}
    service: {{ $.Chart.Name }}
    costcentre: {{ .Values.global.costcentre | quote }}
    schedule: {{ .Values.global.schedule | quote }}
spec:
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: {{ .Values.app.containerPort }}
  type: NodePort
  selector:
    deployment: {{ $.Chart.Name }}