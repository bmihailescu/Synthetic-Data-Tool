apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Chart.Name }}
  namespace: {{ $.Values.global.namespace | default $.Release.Namespace }}
  labels:
    application: {{ $.Chart.Name }}
    deployment: {{ $.Chart.Name }}
    service: {{ $.Chart.Name }}
    costcentre: {{ .Values.global.costcentre | quote }}
    schedule: {{ .Values.global.schedule | quote }}
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: {{ $.Values.app.url | quote }}
      http:
        paths:
         - path: /
           pathType: ImplementationSpecific
           backend:
              service:
                name: {{ $.Chart.Name }}
                port:
                  number: 443